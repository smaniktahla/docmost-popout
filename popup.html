<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; min-width: 220px; }
  h3 { margin: 0; padding: 8px 12px; font-size: 12px; color: #666; text-transform: uppercase; }
  button.space { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; font: inherit; cursor: pointer; }
  button.space:hover { background: #e8f0fe; }
  #msg { padding: 8px 12px; color: #666; }
</style>
<h3>Title</h3>
<input id="title" placeholder="Untitled" style="margin:0 12px 4px;width:calc(100% - 24px);padding:5px;box-sizing:border-box">
<h3>New note in…</h3>
<div id="list"></div>
<div id="msg"></div>
<button class="space" id="settings" style="border-top:1px solid #ddd;color:#555">⚙ Settings</button>
<script src="popup.js"></script>
